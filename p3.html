<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>환도 還刀 — P3 전투 루프 하네스</title>
<style>
  /*
   * index.html의 셸을 그대로 쓴다. 이 파일은 P3-B 게이트를 눈으로 보기 위한 임시 진입이고
   * vite build의 입력이 아니다 — dev server에서만 열린다. P6-1의 screens/manager.ts가
   * 생기면 진입이 그쪽으로 가고 이 파일과 src/dev/p3-harness.ts는 함께 지운다.
   */
  html, body { height: 100%; margin: 0; }
  body {
    background: #0b0d13;
    display: grid;
    place-items: center;
    overflow: hidden;
    user-select: none;
  }
  #stage { display: block; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script type="module">
  const harness = await import('/src/dev/p3-harness.ts');
  harness.startP3Harness();
</script>
</body>
</html>
