<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>환도 還刀</title>
<!--
  data: URI라 D-03의 단일 파일 빌드에 외부 요청이 안 붙는다. 이것이 없으면 브라우저가
  /favicon.ico를 요청하고 어느 서버에서든 404가 콘솔에 남는다.
  색은 config/palette.ts의 ink900 · hwang · baek 그대로다.
-->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2306070a'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23f5b324' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23f5b324'/%3E%3Cpath d='M5 27 L27 5' stroke='%23ede6d8' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  /*
   * 페이지 셸만 여기 있다. 게임의 색은 전부 config/palette.ts가 갖는다 (12 §3.2).
   * 레터박스 띠는 그려지는 픽셀이 아니라 이 body 배경이다 — 캔버스를 화면에 맞춘
   * 크기로만 만들고 남는 자리를 배경이 채우므로, 06 §3.5의 fill-rate 예산이 띠에 안 쓰인다.
   */
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: #0b0d13;
    display: grid;
    place-items: center;
    overflow: hidden;
    /* 이동 중 드래그가 선택으로 잡히면 커서가 게임 밖으로 새어 나간다 */
    user-select: none;
  }
  #stage {
    display: block;
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
